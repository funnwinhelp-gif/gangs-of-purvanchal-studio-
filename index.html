<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Gangs of Purvanchal</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#f59e0b" />
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #090d16; color: #f8fafc;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  #gameCanvas { display: block; width: 100vw; height: 100vh; }

  .hud {
    position: fixed; top: 8px; left: 8px; right: 8px;
    display: flex; flex-wrap: wrap; gap: 6px;
    pointer-events: none; z-index: 10;
  }
  .pill {
    background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(245, 158, 11, 0.5);
    padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    backdrop-filter: blur(6px);
  }

  .top-btns {
    position: fixed; top: 66px; left: 8px; right: 8px;
    display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px;
    padding-bottom: 4px; z-index: 15; touch-action: pan-x;
  }
  .top-btns::-webkit-scrollbar { display: none; }

  button.ui-btn {
    background: rgba(30, 41, 59, 0.94); color: #f8fafc; border: 1px solid #f59e0b;
    padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; touch-action: manipulation;
  }
  button.ui-btn.gold { background: #f59e0b; color: #090d16; }

  #cutsceneBox {
    position: fixed; left: 50%; bottom: 136px; transform: translateX(-50%);
    width: min(94vw, 560px); background: rgba(15, 23, 42, 0.96);
    border: 1.5px solid #f59e0b; border-radius: 14px; padding: 12px 14px;
    display: none; z-index: 25; box-shadow: 0 12px 30px rgba(0,0,0,0.65);
  }
  .cs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cs-speaker { font-weight: 800; font-size: 13px; color: #fbbf24; }
  .cs-tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #1e293b; color: #38bdf8; }
  .cs-text { font-size: 13px; line-height: 1.45; color: #f1f5f9; margin-bottom: 10px; }
  .cs-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .touch-controls {
    position: fixed; left: 0; right: 0; bottom: 12px; padding: 0 14px;
    display: flex; justify-content: space-between; align-items: flex-end;
    pointer-events: none; z-index: 12;
  }
  .joy-pad {
    width: 112px; height: 112px; border-radius: 50%;
    background: rgba(30, 41, 59, 0.72); border: 2px solid rgba(245, 158, 11, 0.65);
    position: relative; pointer-events: auto;
  }
  .joy-stick {
    width: 44px; height: 44px; border-radius: 50%; background: #f59e0b;
    position: absolute; left: 34px; top: 34px;
  }
  .act-pad {
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px;
    max-width: 215px; pointer-events: auto;
  }
  .pad-btn {
    background: rgba(30, 41, 59, 0.9); color: #fff; border: 1px solid #f59e0b;
    border-radius: 10px; padding: 9px 11px; font-size: 11px; font-weight: 800;
    touch-action: manipulation;
  }
  .pad-btn.fire { background: #dc2626; border-color: #fca5a5; }

  #modal {
    position: fixed; inset: 0; background: rgba(2, 6, 23, 0.88);
    display: none; align-items: center; justify-content: center; padding: 14px; z-index: 30;
  }
  .modal-card {
    width: 100%; max-width: 580px; max-height: 84vh; overflow-y: auto;
    background: #111827; border: 1px solid #334155; border-radius: 14px; padding: 16px;
    touch-action: pan-y;
  }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 8px; margin-top: 10px; }
  .item-box {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; font-size: 12px;
  }
  .item-box button { margin-top: 8px; width: 100%; }
  input, select {
    width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 10px;
    border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="hud">
  <div class="pill" id="hudLevel">Level 1/100 (Training)</div>
  <div class="pill" id="hudChar">Dex • Combat Knife</div>
  <div class="pill" id="hudWallet">Coins: 500 | Gems: 25</div>
  <div class="pill" id="hudStatus">HP: 100 | 2026 Scorpio</div>
</div>

<div class="top-btns">
  <button class="ui-btn gold" onclick="openTab('story')">Story & 100 Levels</button>
  <button class="ui-btn" onclick="openTab('chars')">Characters</button>
  <button class="ui-btn" onclick="openTab('garage')">2026 Garage</button>
  <button class="ui-btn" onclick="openTab('armory')">Weapons</button>
  <button class="ui-btn" onclick="openTab('side')">Side Missions</button>
  <button class="ui-btn" onclick="openTab('admin')">Admin Price</button>
  <button class="ui-btn" id="sndBtn" onclick="toggleSound()">SFX: ON</button>
</div>

<div id="cutsceneBox">
  <div class="cs-header">
    <span class="cs-speaker" id="csSpeaker">Dex</span>
    <span class="cs-tag" id="csTag">TWIST</span>
  </div>
  <div class="cs-text" id="csText"></div>
  <div class="cs-actions">
    <button class="ui-btn" onclick="closeCutscene()">Skip</button>
    <button class="ui-btn gold" id="csNextBtn" onclick="nextCutsceneLine()">Next</button>
  </div>
</div>

<div class="touch-controls">
  <div class="joy-pad" id="joyPad"><div class="joy-stick" id="joyStick"></div></div>
  <div class="act-pad">
    <button class="pad-btn fire" onclick="fireShot()">FIRE</button>
    <button class="pad-btn" onclick="cycleVehicle()">VEHICLE</button>
    <button class="pad-btn" onclick="cycleWeapon()">WEAPON</button>
    <button class="pad-btn" onclick="claimAdReward()">+AD REWARD</button>
  </div>
</div>

<div id="modal">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 id="modalTitle" style="margin:0;color:#fbbf24;">Menu</h3>
      <button class="ui-btn" onclick="closeModal()">Close</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gop_save_v2';
const defaultState = {
  level: 1,
  maxUnlocked: 1,
  coins: 500,
  gems: 25,
  hp: 100,
  char: 'Dex',
  ownedChars: ['Dex'],
  vehicle: '2026 Scorpio',
  ownedVehicles: ['2026 Scorpio'],
  weapon: 'Combat Knife',
  ownedWeapons: ['Combat Knife', '9mm Pistol'],
  sideDone: 0,
  sfxOn: true,
  cutsceneSeen: {},
  prices: {
    coinPackRupees: 49,
    coinPackAmount: 1000,
    gemPackRupees: 99,
    gemPackAmount: 50,
    adRewardCoins: 150,
    charUnlockCoins: 600,
    vehicleUnlockCoins: 800,
    weaponUnlockCoins: 500
  }
};

let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || structuredClone(defaultState);
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); updateHud(); }

const CHARACTERS = [
  { name: 'Dex', role: 'Free Starter Hero', power: 'Street Striker • Balanced', cost: 0 },
  { name: 'Vesper', role: 'Heroine', power: 'Rapid Reflex • Close Ally', cost: 600 },
  { name: 'Seraphina', role: 'Villain Girl', power: 'Shadow Charm • Double-Edge', cost: 850 },
  { name: 'Malkov', role: 'Syndicate Villain', power: 'Heavy Armor • Ruthless', cost: 1200 },
  { name: 'Nova', role: 'High-Energy Runner', power: 'Nitro Sprint • Fast Strike', cost: 750 },
  { name: 'Kaelen', role: 'Tactical Enforcer', power: 'Sharp Aim • Control', cost: 900 },
  { name: 'Vex', role: 'Shadow Operative', power: 'Quick Escape • Stealth', cost: 950 }
];

const VEHICLES_2026 = [
  { name: '2026 Scorpio', type: 'SUV', speed: 4.5, color: '#f59e0b', cost: 0 },
  { name: '2026 Thar', type: 'Off-Roader', speed: 4.9, color: '#ea580c', cost: 700 },
  { name: '2026 Fortuner', type: 'Boss SUV', speed: 5.3, color: '#e2e8f0', cost: 1100 },
  { name: 'Police Interceptor', type: 'Pursuit', speed: 5.7, color: '#38bdf8', cost: 1300 },
  { name: 'Superbike X1', type: 'Bike', speed: 6.0, color: '#ef4444', cost: 650 },
  { name: 'Purvanchal Express', type: 'Train', speed: 6.3, color: '#a855f7', cost: 1500 },
  { name: 'SkyWing Jet', type: 'Flight', speed: 7.2, color: '#22c55e', cost: 2200 },
  { name: 'Apex Chopper', type: 'Helicopter', speed: 6.7, color: '#eab308', cost: 2000 }
];

const WEAPONS = [
  { name: 'Combat Knife', dmg: 24, range: 52, cost: 0 },
  { name: '9mm Pistol', dmg: 34, range: 65, cost: 0 },
  { name: 'Street SMG', dmg: 46, range: 70, cost: 500 },
  { name: 'Tactical Shotgun', dmg: 70, range: 62, cost: 850 },
  { name: '2026 Assault Rifle', dmg: 85, range: 75, cost: 1200 },
  { name: 'Marksman Sniper', dmg: 120, range: 90, cost: 1600 },
  { name: 'Heavy Launcher', dmg: 165, range: 85, cost: 2400 }
];

const SCENES = {
  trainingTwist: {
    tag: 'TRAINING CLIFFHANGER',
    lines: [
      { speaker: 'Dex', text: 'Drill clear. Vesper, lagta hai Purvanchal ke tracks clean hain.' },
      { speaker: 'Vesper', text: 'Mat bhatko Dex... kisi ne CCTV feed pehle hi hijack kar li thi.' },
      { speaker: 'Seraphina', text: 'Acha laga dekh kar ki tum dono abhi bhi purane khel mein uljhe ho.' },
      { speaker: 'Malkov', text: 'Training yahin khatam hoti hai, Dex. Agla kadam tumhara imtihan hoga.' }
    ]
  },
  romanceAndRivalry: {
    tag: 'STORY ARC • DEX & VESPER / MALKOV & SERAPHINA',
    lines: [
      { speaker: 'Dex', text: 'Vesper, agar situation bigdi toh pehle tum safe zone mein nikalogi.' },
      { speaker: 'Vesper', text: 'Main tumhare peeche chhupne aayi thi kya, Dex? Gadi sambhalo.' },
      { speaker: 'Seraphina', text: 'Malkov, tumhe lagta hai Dex haar maanega? Uske iraade alag hain.' },
      { speaker: 'Malkov', text: 'Jo bhi ho Seraphina, board par har mohra meri chaal se chalega.' }
    ]
  }
};

let audioCtx = null;
function playTone(freq = 440, dur = 0.08, type = 'triangle', gainVal = 0.08) {
  if (!state.sfxOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (_) {}
}

function toggleSound() {
  state.sfxOn = !state.sfxOn;
  document.getElementById('sndBtn').textContent = `SFX: ${state.sfxOn ? 'ON' : 'OFF'}`;
  saveState();
}

let activeScene = null, sceneIdx = 0;
function startCutscene(key, force = false) {
  if (!force && state.cutsceneSeen[key]) return;
  const sc = SCENES[key];
  if (!sc) return;
  activeScene = sc; sceneIdx = 0;
  state.cutsceneSeen[key] = true;
  saveState();
  renderCutscene();
}
function renderCutscene() {
  if (!activeScene) return;
  const line = activeScene.lines[sceneIdx];
  document.getElementById('csSpeaker').textContent = line.speaker;
  document.getElementById('csTag').textContent = activeScene.tag;
  document.getElementById('csText').textContent = line.text;
  document.getElementById('csNextBtn').textContent = sceneIdx < activeScene.lines.length - 1 ? 'Next' : 'Continue';
  document.getElementById('cutsceneBox').style.display = 'block';
  playTone(560, 0.09, 'sine', 0.07);
}
function nextCutsceneLine() {
  if (!activeScene) return;
  if (sceneIdx < activeScene.lines.length - 1) {
    sceneIdx++; renderCutscene();
  } else closeCutscene();
}
function closeCutscene() {
  activeScene = null;
  document.getElementById('cutsceneBox').style.display = 'none';
}

const WORLD = { w: 1800, h: 1300, roadStep: 360 };
const BUILDINGS = [
  { x: 90, y: 90, w: 190, h: 190 }, { x: 450, y: 90, w: 200, h: 180 },
  { x: 810, y: 90, w: 210, h: 190 }, { x: 1170, y: 90, w: 200, h: 185 },
  { x: 90, y: 450, w: 190, h: 200 }, { x: 810, y: 450, w: 210, h: 195 },
  { x: 1170, y: 450, w: 200, h: 200 }, { x: 450, y: 810, w: 200, h: 190 },
  { x: 810, y: 810, w: 210, h: 190 }, { x: 1530, y: 450, w: 180, h: 200 }
];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const player = { x: 220, y: 360, angle: 0, fireCooldown: 0 };
const enemies = [];
const bullets = [];
const enemyBullets = [];
const keys = {};

function spawnEnemies() {
  enemies.length = 0;
  const count = Math.min(14, 3 + Math.floor(state.level / 3));
  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 380 + ((i * 223 + state.level * 71) % (WORLD.w - 480)),
      y: 260 + ((i * 179 + state.level * 59) % (WORLD.h - 360)),
      hp: 45 + state.level * 7,
      speed: Math.min(3.8, 1.35 + state.level * 0.03),
      cd: 40 + (i * 17) % 60
    });
  }
}
spawnEnemies();

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') fireShot();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const joyPad = document.getElementById('joyPad');
const joyStick = document.getElementById('joyStick');
let joyActive = false, joyVec = { x: 0, y: 0 };

joyPad.addEventListener('touchstart', () => { joyActive = true; }, { passive: false });
joyPad.addEventListener('touchmove', e => {
  if (!joyActive) return;
  const rect = joyPad.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const t = e.touches[0];
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const maxR = 34, dist = Math.hypot(dx, dy);
  if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
  joyStick.style.left = (34 + dx) + 'px';
  joyStick.style.top = (34 + dy) + 'px';
  joyVec.x = dx / maxR; joyVec.y = dy / maxR;
}, { passive: false });
function resetJoy() {
  joyActive = false; joyVec = { x: 0, y: 0 };
  joyStick.style.left = '34px'; joyStick.style.top = '34px';
}
joyPad.addEventListener('touchend', resetJoy);
joyPad.addEventListener('touchcancel', resetJoy);

function fireShot() {
  if (player.fireCooldown > 0) return;
  const w = WEAPONS.find(x => x.name === state.weapon) || WEAPONS[0];
  bullets.push({
    x: player.x + Math.cos(player.angle) * 22,
    y: player.y + Math.sin(player.angle) * 22,
    vx: Math.cos(player.angle) * 11,
    vy: Math.sin(player.angle) * 11,
    dmg: w.dmg,
    life: w.range
  });
  player.fireCooldown = 10;
  playTone(720, 0.05, 'square', 0.05);
}

function cycleVehicle() {
  if (!state.ownedVehicles.length) return;
  const idx = state.ownedVehicles.indexOf(state.vehicle);
  state.vehicle = state.ownedVehicles[(idx + 1) % state.ownedVehicles.length];
  playTone(420, 0.07, 'triangle', 0.06);
  saveState();
}

function cycleWeapon() {
  if (!state.ownedWeapons.length) return;
  const idx = state.ownedWeapons.indexOf(state.weapon);
  state.weapon = state.ownedWeapons[(idx + 1) % state.ownedWeapons.length];
  playTone(620, 0.07, 'triangle', 0.06);
  saveState();
}

function claimAdReward() {
  state.coins += Number(state.prices.adRewardCoins || 150);
  state.gems += 2;
  playTone(880, 0.12, 'sine', 0.08);
  saveState();
}

function advanceLevel() {
  const justFinishedLevel = state.level;
  if (state.level < 100) {
    state.level += 1;
    state.maxUnlocked = Math.max(state.maxUnlocked, state.level);
    state.coins += 120 + state.level * 10;
    state.hp = Math.min(100, state.hp + 20);
    spawnEnemies();
    playTone(960, 0.16, 'triangle', 0.08);
    saveState();
    if (justFinishedLevel === 1) startCutscene('trainingTwist');
    else if (justFinishedLevel === 2) startCutscene('romanceAndRivalry');
  }
}

function updateHud() {
  const tag = state.level === 1 ? 'Training' : state.level > 75 ? 'Extreme' : state.level > 35 ? 'Hard' : 'Rising';
  document.getElementById('hudLevel').textContent = `Level ${state.level}/100 (${tag})`;
  document.getElementById('hudChar').textContent = `${state.char} • ${state.weapon}`;
  document.getElementById('hudWallet').textContent = `Coins: ${state.coins} | Gems: ${state.gems}`;
  document.getElementById('hudStatus').textContent = `HP: ${state.hp} | ${state.vehicle}`;
  document.getElementById('sndBtn').textContent = `SFX: ${state.sfxOn ? 'ON' : 'OFF'}`;
}

function openTab(tab) {
  const modal = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  modal.style.display = 'flex';

  if (tab === 'story') {
    title.textContent = 'Story Scenes & 100-Level Roadmap';
    body.innerHTML = `
      <p style="font-size:12px;color:#cbd5e1;">Levels 1 to 100 escalation with Dex, Vesper, Malkov & Seraphina.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <button class="ui-btn gold" onclick="closeModal();startCutscene('trainingTwist', true);">Play Training Twist Scene</button>
        <button class="ui-btn" onclick="closeModal();startCutscene('romanceAndRivalry', true);">Play Dex-Vesper / Malkov Scene</button>
      </div>
      <label style="font-size:12px;width:100%;">Jump to Unlocked Level (1–${state.maxUnlocked}):
        <select onchange="state.level=Number(this.value);spawnEnemies();saveState();openTab('story');">
          ${Array.from({length: state.maxUnlocked}, (_, i) => `<option value="${i+1}" ${state.level===i+1?'selected':''}>Level ${i+1}</option>`).join('')}
        </select>
      </label>`;
  } else if (tab === 'chars') {
    title.textContent = 'Characters (Dex Free + Roster)';
    body.innerHTML = `<div class="grid-2">${CHARACTERS.map(c => {
      const owned = state.ownedChars.includes(c.name);
      const price = c.cost === 0 ? 0 : state.prices.charUnlockCoins;
      return `<div class="item-box">
        <strong>${c.name}</strong><br><span style="color:#94a3b8;">${c.role}</span><br><span>${c.power}</span>
        <button class="ui-btn ${owned ? 'gold' : ''}" onclick="selectOrBuyChar('${c.name}', ${price})">
          ${state.char === c.name ? 'Equipped' : owned ? 'Equip' : `Unlock (${price} Coins)`}
        </button>
      </div>`;
    }).join('')}</div>`;
  } else if (tab === 'garage') {
    title.textContent = '2026 Vehicles Garage';
    body.innerHTML = `<div class="grid-2">${VEHICLES_2026.map(v => {
      const owned = state.ownedVehicles.includes(v.name);
      const price = v.cost === 0 ? 0 : state.prices.vehicleUnlockCoins;
      return `<div class="item-box">
        <strong>${v.name}</strong><br><span style="color:#94a3b8;">${v.type} • Speed ${v.speed}</span>
        <button class="ui-btn ${owned ? 'gold' : ''}" onclick="selectOrBuyVeh('${v.name}', ${price})">
          ${state.vehicle === v.name ? 'Active Ride' : owned ? 'Select Ride' : `Buy (${price} Coins)`}
        </button>
      </div>`;
    }).join('')}</div>`;
  } else if (tab === 'armory') {
    title.textContent = 'Weapons Progression';
    body.innerHTML = `<div class="grid-2">${WEAPONS.map(w => {
      const owned = state.ownedWeapons.includes(w.name);
      const price = w.cost === 0 ? 0 : state.prices.weaponUnlockCoins;
      return `<div class="item-box">
        <strong>${w.name}</strong><br><span style="color:#94a3b8;">Damage: ${w.dmg}</span>
        <button class="ui-btn ${owned ? 'gold' : ''}" onclick="selectOrBuyWpn('${w.name}', ${price})">
          ${state.weapon === w.name ? 'Equipped' : owned ? 'Equip' : `Buy (${price} Coins)`}
        </button>
      </div>`;
    }).join('')}</div>`;
  } else if (tab === 'side') {
    title.textContent = 'Side Missions & Packs';
    body.innerHTML = `
      <div class="item-box">
        <strong>Side Contracts Done: ${state.sideDone}</strong><br>
        Quick district contracts give extra Coins & Gems.
        <button class="ui-btn
